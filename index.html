      /* ==========================================================================
   14. رویدادها / Event Handling
   ========================================================================== */
      document.addEventListener("click", async (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        /* ناوبری */
        if (act === "go") {
          const view = el.dataset.view;
          const params = {};
          ["id", "cat", "q", "tab", "role", "type", "sort"].forEach((k) => {
            if (el.dataset[k] !== undefined) params[k] = el.dataset[k];
          });
          if (view === "search" && el.dataset.cat) params.cat = el.dataset.cat;
          go(view, params);
          return;
        }

        if (act === "back") {
          history.length > 1 ? history.back() : go("home");
          return;
        }
        if (act === "close-sheet") {
          closeSheet();
          return;
        }

        /* زبان */
        if (act === "lang") {
          state.lang = el.dataset.lang === "en" ? "en" : "fa";
          applyLang();
          render();
          return;
        }

        /* خروج */
        if (act === "logout") {
          openSheet(`
      <h3 style="margin-bottom:8px">${esc(t("logoutConfirm"))}</h3>
      <div class="flex gap12 mt16">
        <button class="btn btn-danger" style="flex:1" data-act="logout-confirm">${esc(t("yes"))}</button>
        <button class="btn btn-outline" style="flex:1" data-act="close-sheet">${esc(t("no"))}</button>
      </div>`);
          return;
        }
        if (act === "logout-confirm") {
          closeSheet();
          await doLogout();
          return;
        }

        /* فراموشی رمز */
        if (act === "forgot") {
          openSheet(`
      <h3 style="margin-bottom:14px">${esc(t("forgot"))}</h3>
      <form data-form="forgot">
        <div class="field">
          <label class="label">${esc(t("phone"))}</label>
          <div class="phone-wrap">
            <span class="cc">🇦🇫 +93</span>
            <input class="input" name="phone" inputmode="numeric" maxlength="10" required>
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">${esc(t("confirm"))}</button>
      </form>
      <p class="muted fs12 mt12">${esc(t("emailHint"))}: ${esc(SETTINGS.supportPhone)}</p>`);
          return;
        }

        /* انتخاب نقش */
        if (act === "pick-role") {
          const form = el.closest("form");
          const role = el.dataset.role;
          form.querySelector('input[name="role"]').value = role;
          form
            .querySelectorAll('[data-act="pick-role"]')
            .forEach((b) => b.classList.toggle("on", b === el));
          return;
        }

        /* تماس */
        if (act === "call") {
          window.location.href = "tel:" + el.dataset.phone;
          return;
        }

        /* سبد خرید */
        if (act === "add-cart") {
          const p = await DB.get("products", el.dataset.id);
          if (!p) return;
          const unitSel = $("#unitSel");
          const unit = unitSel
            ? unitSel.value
            : ((p.prices || [])[0] || {}).unit;
          const qtyEl = $("#pdQty");
          const qty = qtyEl ? parseFloat(qtyEl.textContent) || 1 : 1;
          const info = priceForUnit(p, unit, qty);
          const store = await DB.get("stores", p.storeId);
          addToCart({
            productId: p.id,
            name: p.name,
            emoji: p.emoji || catEmoji(p.categoryId),
            unit,
            price: info.price,
            qty,
            storeId: p.storeId,
            storeName: store ? store.storeName : "",
            deliveryFee:
              store && store.deliveryAvailable
                ? Number(store.deliveryFee) || 0
                : 0,
          });
          toast(t("addToCart") + " ✓", "ok");
          return;
        }
        if (act === "cart-plus") {
          const i = state.cart.find((x) => x.key === el.dataset.key);
          if (i) setCartQty(i.key, i.qty + 1);
          render();
          return;
        }
        if (act === "cart-minus") {
          const i = state.cart.find((x) => x.key === el.dataset.key);
          if (i) setCartQty(i.key, i.qty - 1);
          render();
          return;
        }
        if (act === "cart-remove") {
          removeFromCart(el.dataset.key);
          render();
          return;
        }

        /* مقدار در صفحه محصول */
        if (act === "pd-plus" || act === "pd-minus") {
          const el2 = $("#pdQty");
          let v = parseFloat(el2.textContent) || 1;
          v = act === "pd-plus" ? v + 1 : Math.max(1, v - 1);
          el2.textContent = v;
          recalcProduct();
          return;
        }

        /* امتیاز */
        if (act === "rate-store") {
          openRateSheet(el.dataset.id);
          return;
        }

        /* حذف محصول */
        if (act === "delete-product") {
          openSheet(`
      <h3 style="margin-bottom:8px">${esc(t("deleteConfirm"))}</h3>
      <div class="flex gap12 mt16">
        <button class="btn btn-danger" style="flex:1" data-act="delete-product-confirm" data-id="${el.dataset.id}">${esc(t("yes"))}</button>
        <button class="btn btn-outline" style="flex:1" data-act="close-sheet">${esc(t("no"))}</button>
      </div>`);
          return;
        }
        if (act === "delete-product-confirm") {
          await DB.remove("products", el.dataset.id);
          closeSheet();
          toast(t("productDeleted"), "ok");
          go("seller-products");
          return;
        }

        /* ردیف قیمت */
        if (act === "add-price-row") {
          const wrap = $("#priceRows");
          const div = document.createElement("div");
          div.innerHTML = priceRowHTML(
            { unit: "piece", price: "" },
            wrap.children.length,
          );
          wrap.appendChild(div.firstElementChild);
          return;
        }
        if (act === "del-price-row") {
          const row = el.closest("[data-price-row]");
          if ($("#priceRows").children.length > 1) row.remove();
          return;
        }

        /* وضعیت سفارش */
        if (act === "set-order-status") {
          await DB.update("orders", el.dataset.id, {
            status: el.dataset.status,
            updatedBy: state.profile.uid,
          });
          toast(t("saved"), "ok");
          render();
          return;
        }

        /* ادمین: فعال‌سازی سریع */
        if (act === "quick-activate") {
          await activateSeller(el.dataset.id, 30, 0, "manual");
          toast(t("activate") + " ✓", "ok");
          render();
          return;
        }
        if (act === "suspend-seller") {
          await DB.update("sellers", el.dataset.id, { status: "suspended" });
          await DB.update("stores", el.dataset.id, { status: "suspended" });
          await logAdmin("suspend_seller", el.dataset.id);
          toast(t("suspend"), "ok");
          render();
          return;
        }

        /* ادمین: پرداخت */
        if (act === "approve-payment") {
          const payId = el.dataset.id;
          const pay = await DB.get("payments", payId);
          const daysEl = $("#days-" + payId);
          const days = Math.max(
            1,
            parseInt(daysEl ? daysEl.value : 30, 10) || 30,
          );
          await DB.update("payments", payId, {
            status: "approved",
            reviewedBy: state.profile.uid,
            reviewedAt: new Date().toISOString(),
          });
          await activateSeller(
            pay.sellerId,
            days,
            pay.amount,
            "payment_approved",
          );
          toast(t("approved") + " ✓", "ok");
          render();
          return;
        }
        if (act === "reject-payment") {
          await DB.update("payments", el.dataset.id, {
            status: "rejected",
            reviewedBy: state.profile.uid,
            reviewedAt: new Date().toISOString(),
          });
          await logAdmin("reject_payment", el.dataset.id);
          toast(t("rejected"), "ok");
          render();
          return;
        }

        /* ادمین: ترتیب فروشگاه */
        if (act === "rank-up" || act === "rank-down") {
          const stores = (await DB.list("stores")).sort(
            (a, b) => (a.displayOrder ?? 999) - (b.displayOrder ?? 999),
          );
          const i = stores.findIndex((s) => s.id === el.dataset.id);
          const j = act === "rank-up" ? i - 1 : i + 1;
          if (j < 0 || j >= stores.length) return;
          stores.forEach((s, idx) => {
            s.displayOrder = idx + 1;
          });
          const tmp = stores[i].displayOrder;
          stores[i].displayOrder = stores[j].displayOrder;
          stores[j].displayOrder = tmp;
          for (const s of [stores[i], stores[j]])
            await DB.update("stores", s.id, { displayOrder: s.displayOrder });
          await logAdmin("change_ranking", stores[i].storeName);
          render();
          return;
        }

        /* ادمین: نظرات */
        if (act === "toggle-feedback") {
          await DB.update("feedback", el.dataset.id, {
            status: el.dataset.status,
          });
          await logAdmin("moderate_feedback", el.dataset.id);
          render();
          return;
        }
        if (act === "delete-feedback") {
          await DB.remove("feedback", el.dataset.id);
          await logAdmin("delete_feedback", el.dataset.id);
          toast(t("delete"), "ok");
          render();
          return;
        }

        /* فروشنده شدن */
        if (act === "become-seller") {
          openSheet(`
      <h3 style="margin-bottom:8px">${esc(t("becomeSeller"))}</h3>
      <p class="fs13 muted mb16">${esc(t("sellerFree"))} — ${esc(t("subscriptionPrice"))}: ${money(SETTINGS.sellerMonthlyPrice)}</p>
      <div class="flex gap12">
        <button class="btn btn-primary" style="flex:1" data-act="confirm-become-seller">${esc(t("confirm"))}</button>
        <button class="btn btn-outline" style="flex:1" data-act="close-sheet">${esc(t("cancel"))}</button>
      </div>`);
          return;
        }
        if (act === "confirm-become-seller") {
          closeSheet();
          const uidv = state.profile.uid;
          await DB.update("users", uidv, { role: "seller" });
          await createSellerRecords(uidv, state.profile, {});
          state.profile.role = "seller";
          toast(t("saved"), "ok");
          go("seller-setup");
          return;
        }
      });

      /* تغییر مقدار در صفحه محصول */
      function recalcProduct() {
        const box = $("#pdData");
        if (!box) return;
        const rows = JSON.parse(box.dataset.price || "[]");
        const unit = $("#unitSel") ? $("#unitSel").value : box.dataset.unit;
        const qty = parseFloat($("#pdQty").textContent) || 1;
        const row = rows.find((r) => r.unit === unit) ||
          rows[0] || { price: 0 };
        let price = Number(row.price) || 0;

        const bulkPrice = parseFloat(box.dataset.bulk);
        if (
          !isNaN(bulkPrice) &&
          box.dataset.bulkunit === unit &&
          qty >= (parseFloat(box.dataset.bulkmin) || 0)
        ) {
          price = bulkPrice;
        }
        const delivery = parseFloat(box.dataset.delivery) || 0;
        const sub = price * qty;
        const subEl = $("#pdSub"),
          totEl = $("#pdTotal");
        if (subEl) subEl.textContent = money(sub);
        if (totEl) totEl.textContent = money(sub + delivery);
      }

      /* تغییر سلکت‌ها و فرم‌ها */
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.act === "unit-change") recalcProduct();
        if (el.id === "sortSel") {
          const params = Object.assign({}, state.params, { sort: el.value });
          go("search", params);
        }
      });

      /* فرم‌ها */
      document.addEventListener("submit", async (e) => {
        const form = e.target.closest("[data-form]");
        if (!form) return;
        e.preventDefault();
        const type = form.dataset.form;

        try {
          /* جستجو */
          if (type === "hero-search") {
            const q = (new FormData(form).get("q") || "").trim();
            go("search", q ? { q } : {});
            return;
          }

          /* ورود */
          if (type === "login") {
            showLoader(true);
            await doLogin(form);
            showLoader(false);
            return;
          }

          /* ثبت نام */
          if (type === "signup") {
            showLoader(true);
            await doSignup(form);
            showLoader(false);
            return;
          }

          /* فراموشی رمز */
          if (type === "forgot") {
            const phone = new FormData(form).get("phone");
            if (!isValidPhone(phone)) throw new Error(t("errPhone"));
            const res = await Auth.resetPassword(phone);
            closeSheet();
            if (res === "EMAIL_SENT")
              toast("✅ لینک بازیابی به ایمیل شما ارسال شد", "ok");
            else
              toast(
                "برای بازیابی رمز با پشتیبانی تماس بگیرید: " +
                  SETTINGS.supportPhone,
                "",
              );
            return;
          }

          /* معلومات فروشگاه */
          if (type === "seller-setup") {
            const fd = new FormData(form);
            const store = {
              storeName: (fd.get("storeName") || "").trim(),
              businessCategory: fd.get("businessCategory"),
              description: (fd.get("description") || "").trim(),
              address: (fd.get("address") || "").trim(),
              openingHours: (fd.get("openingHours") || "").trim(),
              deliveryAvailable: fd.get("deliveryAvailable") === "1",
              deliveryFee: Number(fd.get("deliveryFee")) || 0,
              phone: state.profile.phone,
            };
            if (!store.storeName) throw new Error(t("required"));
            await DB.update("stores", state.profile.uid, store);
            toast(t("storeSaved"), "ok");
            go("seller");
            return;
          }

          /* محصول */
          if (type === "product") {
            const fd = new FormData(form);
            const units = fd.getAll("punit[]");
            const prices = fd.getAll("pprice[]");
            const rows = units
              .map((u, i) => ({ unit: u, price: Number(prices[i]) || 0 }))
              .filter((r) => r.price > 0);
            if (!rows.length) throw new Error(t("required"));

            const store = await DB.get("stores", state.profile.uid);
            const data = {
              sellerId: state.profile.uid,
              storeId: state.profile.uid,
              type: "product",
              name: (fd.get("name") || "").trim(),
              description: (fd.get("description") || "").trim(),
              categoryId: fd.get("categoryId"),
              emoji: catEmoji(fd.get("categoryId")),
              photos: fd.get("photo") ? [String(fd.get("photo")).trim()] : [],
              prices: rows,
              bulkPrice: fd.get("bulkPrice")
                ? Number(fd.get("bulkPrice"))
                : null,
              bulkMinQty: fd.get("bulkMinQty")
                ? Number(fd.get("bulkMinQty"))
                : null,
              bulkUnit: fd.get("bulkUnit"),
              availableQuantity: Number(fd.get("availableQuantity")) || 0,
              availabilityStart: fd.get("availabilityStart")
                ? new Date(fd.get("availabilityStart")).toISOString()
                : null,
              availabilityEnd: fd.get("availabilityEnd")
                ? new Date(fd.get("availabilityEnd")).toISOString()
                : null,
              status: fd.get("status"),
              keywords: (fd.get("keywords") || "").trim(),
            };
            if (!data.name) throw new Error(t("required"));

            const id = form.dataset.id;
            if (id) await DB.update("products", id, data);
            else
              await DB.set(
                "products",
                "p" + uid(),
                Object.assign({ createdAt: new Date().toISOString() }, data),
              );

            toast(t("productSaved"), "ok");
            go("seller-products");
            return;
          }

          /* پرداخت */
          if (type === "payment") {
            const fd = new FormData(form);
            const ref = (fd.get("reference") || "").trim();
            if (!ref) throw new Error(t("required"));
            await DB.add("payments", {
              id: "pay" + uid(),
              sellerId: state.profile.uid,
              amount: Number(fd.get("amount")) || SETTINGS.sellerMonthlyPrice,
              currency: "AFN",
              reference: ref,
              note: (fd.get("note") || "").trim(),
              status: "pending",
              submittedAt: new Date().toISOString(),
              reviewedBy: null,
              reviewedAt: null,
              activationStart: null,
              activationEnd: null,
            });
            toast(t("paymentSubmitted"), "ok");
            go("seller-subscription");
            return;
          }

          /* تکمیل خرید */
          if (type === "checkout") {
            if (!state.profile) {
              toast(t("pleaseLogin"), "err");
              go("login");
              return;
            }
            const fd = new FormData(form);
            const name = (fd.get("customerName") || "").trim();
            const phone = fd.get("customerPhone");
            const address = (fd.get("deliveryAddress") || "").trim();
            if (!name || !address || !isValidPhone(phone))
              throw new Error(t("required"));

            const groups = cartGroups();
            const now = new Date().toISOString();

            for (const g of groups) {
              const store = await DB.get("stores", g.storeId);
              await DB.add("orders", {
                id: "ord" + uid(),
                customerId: state.profile.uid,
                sellerId: g.storeId,
                storeId: g.storeId,
                storeName: store ? store.storeName : g.storeName,
                items: g.items.map((i) => ({
                  productId: i.productId,
                  name: i.name,
                  unit: i.unit,
                  price: i.price,
                  qty: i.qty,
                })),
                subtotal: g.subtotal,
                deliveryFee: g.deliveryFee,
                total: g.total,
                customerName: name,
                customerPhone: normPhone(phone),
                deliveryAddress: address,
                district: (fd.get("district") || "").trim(),
                deliveryInstructions: (
                  fd.get("deliveryInstructions") || ""
                ).trim(),
                status: "pending",
                createdAt: now,
                updatedAt: now,
              });
            }

            state.cart = [];
            saveCart();
            toast(t("orderPlaced") + " ✓", "ok");
            go("orders");
            return;
          }

          /* نظر و امتیاز */
          if (type === "rate") {
            const fd = new FormData(form);
            const storeId = form.dataset.store;
            const stars = Number(fd.get("stars")) || 5;
            const text = (fd.get("text") || "").trim();

            await DB.add("feedback", {
              id: "fb" + uid(),
              storeId,
              sellerId: storeId,
              customerId: state.profile.uid,
              customerName: state.profile.name,
              stars,
              text,
              status: "visible",
              createdAt: new Date().toISOString(),
            });
            await DB.add("ratings", {
              id: "rt" + uid(),
              storeId,
              customerId: state.profile.uid,
              stars,
              createdAt: new Date().toISOString(),
            });

            /* به‌روزرسانی اوسط امتیاز */
            const ratings = (await DB.list("ratings")).filter(
              (r) => r.storeId === storeId,
            );
            const avg =
              ratings.reduce((s, r) => s + r.stars, 0) / (ratings.length || 1);
            await DB.update("stores", storeId, {
              ratingAverage: Number(avg.toFixed(1)),
              ratingCount: ratings.length,
            });

            closeSheet();
            toast(t("submitFeedback") + " ✓", "ok");
            render();
            return;
          }
        } catch (err) {
          showLoader(false);
          let msg = err.message || t("errGeneric");
          if (msg.includes("PHONE_TAKEN")) msg = "این شماره قبلاً ثبت شده است";
          if (msg.includes("auth/email-already-in-use"))
            msg = "این شماره قبلاً ثبت شده است";
          if (
            msg.includes("auth/wrong-password") ||
            msg.includes("auth/user-not-found") ||
            msg.includes("BAD_CRED")
          )
            msg = t("errCred");
          if (msg.includes("auth/network-request-failed")) msg = t("errNet");
          if (msg.includes("auth/too-many-requests"))
            msg = "تلاش‌های زیاد. لطفاً بعداً دوباره کوشش کنید.";
          if (msg.includes("permission-denied")) msg = t("errPerm");
          toast(msg, "err");
        }
      });

      /* فعال‌سازی فروشنده توسط ادمین */
      async function activateSeller(sellerId, days, amount, reason) {
        const now = new Date();
        const end = new Date(now.getTime() + days * 864e5);
        await DB.update("sellers", sellerId, {
          status: "active",
          subscriptionStatus: "paid",
          activationStartDate: now.toISOString(),
          activationEndDate: end.toISOString(),
        });
        await DB.update("stores", sellerId, { status: "active" });
        await DB.add("activationHistory", {
          id: "ah" + uid(),
          sellerId,
          startDate: now.toISOString(),
          endDate: end.toISOString(),
          durationDays: days,
          amount: amount || 0,
          reason: reason || "admin_activation",
          activatedBy: state.profile ? state.profile.uid : "admin",
          createdAt: now.toISOString(),
        });
        await logAdmin("activate_seller", `${sellerId} — ${days} days`);
      }

      async function logAdmin(action, details) {
        try {
          await DB.add("adminLogs", {
            id: "log" + uid(),
            adminId: state.profile ? state.profile.uid : "admin",
            adminName: state.profile ? state.profile.name : "Administrator",
            action,
            details,
            createdAt: new Date().toISOString(),
          });
        } catch (e) {
          /* ignore */
        }
      }

      /* ==========================================================================
   15. PWA — آیکون، Manifest و Service Worker
   ========================================================================== */

      /* رسم آیکون برنامه با Canvas */
      function drawAppIcon(size) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const x = c.getContext("2d");

        /* پس‌زمینه گرادیانت */
        const g = x.createLinearGradient(0, 0, size, size);
        g.addColorStop(0, "#16B981");
        g.addColorStop(0.55, "#0E9F6E");
        g.addColorStop(1, "#0A6B58");

        const r = size * 0.235;
        x.beginPath();
        x.moveTo(r, 0);
        x.lineTo(size - r, 0);
        x.quadraticCurveTo(size, 0, size, r);
        x.lineTo(size, size - r);
        x.quadraticCurveTo(size, size, size - r, size);
        x.lineTo(r, size);
        x.quadraticCurveTo(0, size, 0, size - r);
        x.lineTo(0, r);
        x.quadraticCurveTo(0, 0, r, 0);
        x.closePath();
        x.fillStyle = g;
        x.fill();

        /* درخشش بالا */
        const gl = x.createRadialGradient(
          size * 0.32,
          size * 0.22,
          0,
          size * 0.32,
          size * 0.22,
          size * 0.72,
        );
        gl.addColorStop(0, "rgba(255,255,255,.26)");
        gl.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = gl;
        x.fillRect(0, 0, size, size);

        /* دسته سبد */
        const cx = size / 2;
        const bagW = size * 0.46;
        const bagH = size * 0.37;
        const bx = (size - bagW) / 2;
        const by = size * 0.4;

        x.strokeStyle = "#FFFFFF";
        x.lineWidth = size * 0.062;
        x.lineCap = "round";
        x.beginPath();
        x.arc(
          cx,
          by + size * 0.012,
          bagW * 0.26,
          Math.PI * 1.02,
          Math.PI * 1.98,
        );
        x.stroke();

        /* بدنه سبد */
        x.fillStyle = "#FFFFFF";
        const br = size * 0.055;
        x.beginPath();
        x.moveTo(bx + br, by);
        x.lineTo(bx + bagW - br, by);
        x.quadraticCurveTo(bx + bagW, by, bx + bagW, by + br);
        x.lineTo(bx + bagW, by + bagH - br);
        x.quadraticCurveTo(bx + bagW, by + bagH, bx + bagW - br, by + bagH);
        x.lineTo(bx + br, by + bagH);
        x.quadraticCurveTo(bx, by + bagH, bx, by + bagH - br);
        x.lineTo(bx, by + br);
        x.quadraticCurveTo(bx, by, bx + br, by);
        x.closePath();
        x.fill();

        /* نشان طلایی */
        x.fillStyle = "#F5C451";
        x.beginPath();
        x.arc(cx, by + bagH * 0.52, size * 0.052, 0, Math.PI * 2);
        x.fill();

        return c.toDataURL("image/png");
      }

      function setupIcons() {
        const icon = drawAppIcon(192);
        const apple = drawAppIcon(180);
        const fav = drawAppIcon(64);

        const bl = $("#brandLogo");
        if (bl) bl.src = icon;
        const a1 = $("#authLogo");
        if (a1) a1.src = icon;
        const a2 = $("#authLogo2");
        if (a2) a2.src = icon;

        let link = document.querySelector('link[rel="apple-touch-icon"]');
        if (!link) {
          link = document.createElement("link");
          link.rel = "apple-touch-icon";
          document.head.appendChild(link);
        }
        link.href = apple;

        let favLink = document.querySelector('link[rel="icon"]');
        if (!favLink) {
          favLink = document.createElement("link");
          favLink.rel = "icon";
          document.head.appendChild(favLink);
        }
        favLink.href = fav;

        return { icon, apple };
      }

      function setupManifest(iconDataUrl) {
        try {
          const manifest = {
            name: "بازار افغان — Afghan Bazaar",
            short_name: "بازار افغان",
            description: "بازار آنلاین افغانستان — خرید و فروش محصولات و خدمات",
            start_url: ".",
            scope: ".",
            display: "standalone",
            orientation: "portrait",
            background_color: "#F3F6F8",
            theme_color: "#0E9F6E",
            lang: state.lang === "fa" ? "fa-AF" : "en",
            dir: state.lang === "fa" ? "rtl" : "ltr",
            categories: ["shopping", "business"],
            icons: [72, 96, 128, 144, 152, 192, 384, 512].map((s) => ({
              src: drawAppIcon(s),
              sizes: `${s}x${s}`,
              type: "image/png",
              purpose: s >= 192 ? "any maskable" : "any",
            })),
          };

          const blob = new Blob([JSON.stringify(manifest)], {
            type: "application/manifest+json",
          });
          const url = URL.createObjectURL(blob);
          let link = document.querySelector('link[rel="manifest"]');
          if (!link) {
            link = document.createElement("link");
            link.rel = "manifest";
            document.head.appendChild(link);
          }
          link.href = url;
        } catch (e) {
          console.warn("manifest", e);
        }
      }

      function setupServiceWorker() {
        if (!("serviceWorker" in navigator)) return;
        if (location.protocol !== "http:" && location.protocol !== "https:")
          return;
        /* service-worker.js اختیاری است؛ اگر موجود باشد ثبت می‌شود */
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      }

      /* ==========================================================================
   16. راه‌اندازی / Init
   ========================================================================== */
      async function init() {
        /* زبان */
        let savedLang = null;
        try {
          savedLang = localStorage.getItem("afm_lang");
        } catch (e) {}
        state.lang = savedLang || SETTINGS.defaultLanguage || "fa";

        /* Firebase */
        const ok = initFirebase();
        state.demo = !ok;

        /* آیکون‌ها و PWA */
        const { icon } = setupIcons();
        setupManifest(icon);
        setupServiceWorker();

        /* سبد */
        loadCart();

        applyLang();

        /* احراز هویت */
        if (fb.enabled) {
          Auth.onChange(async (prof) => {
            if (prof) {
              state.profile = prof;
              await checkSellerDormancy();
            }
            render();
          });
        } else {
          /* حالت نمایشی: نشست ذخیره‌شده */
          try {
            const s = localStorage.getItem(AUTH_KEY);
            if (s) {
              const sess = JSON.parse(s);
              const u = await DB.get("users", sess.uid);
              if (u) {
                state.profile = u;
                state.user = { uid: u.uid };
              }
            }
          } catch (e) {}
        }

        window.addEventListener("hashchange", render);
        await render();
      }

      /* ذخیره نشست در حالت نمایشی */
      const _origLogin = Auth.login.bind(Auth);
      Auth.login = async (creds) => {
        const r = await _origLogin(creds);
        if (!fb.enabled) {
          try {
            localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: r.uid }));
          } catch (e) {}
        }
        return r;
      };
      const _origSignup = Auth.signup.bind(Auth);
      Auth.signup = async (data) => {
        const r = await _origSignup(data);
        if (!fb.enabled) {
          try {
            localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: r.uid }));
          } catch (e) {}
        }
        return r;
      };
      const _origLogout = Auth.logout.bind(Auth);
      Auth.logout = async () => {
        await _origLogout();
        try {
          localStorage.removeItem(AUTH_KEY);
        } catch (e) {}
      };

      /* اجرا */
      document.addEventListener("DOMContentLoaded", init);
      if (document.readyState !== "loading") init();
    </script>
