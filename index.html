<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0e7a5f">
<title>بازار آنلاین کابل | بخر، بفروش، جستجو کن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f0;
  --card:#ffffff;
  --primary:#0e7a5f;
  --primary-2:#0a5b46;
  --primary-3:#084535;
  --accent:#e0a72a;
  --text:#12211c;
  --muted:#6d7d78;
  --line:#e2e8e5;
  --radius:16px;
  --shadow:0 2px 12px rgba(16,60,45,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  font-size:15px;
  padding-bottom:50px;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit}

/* ================= هدر ================= */
.app-header{
  background:linear-gradient(140deg,#0e7a5f 0%,#0a5b46 55%,#084535 100%);
  color:#fff;
  padding:20px 16px 22px;
  border-radius:0 0 26px 26px;
  box-shadow:0 8px 24px rgba(10,91,70,.28);
  position:relative;
  overflow:hidden;
}
.app-header::after{
  content:"";
  position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.06);
  top:-110px;left:-60px;
}
.header-inner{max-width:720px;margin:0 auto;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:48px;height:48px;flex:0 0 48px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.25);
  border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.82);line-height:1.6}

/* ================= جستجو ================= */
.search-wrap{
  margin-top:16px;
  display:flex;align-items:center;gap:6px;
  background:#fff;
  border-radius:15px;
  padding:4px 12px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
  transition:box-shadow .2s;
}
.search-wrap:focus-within{box-shadow:0 6px 22px rgba(0,0,0,.22),0 0 0 3px rgba(224,167,42,.45)}
.search-icon{font-size:16px;opacity:.55}
.search-wrap input{
  flex:1;border:0;outline:0;background:transparent;
  padding:12px 4px;font-size:15px;color:var(--text);
}
.search-wrap input::placeholder{color:#9aa8a4}
.clear-btn{
  border:0;background:#eef2f0;color:#5c6b66;
  width:26px;height:26px;border-radius:50%;
  font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex:0 0 26px;
}

/* ================= ساختار کلی ================= */
.container{max-width:720px;margin:0 auto;padding:16px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:16px;
}

/* ================= باکس نوشتن آگهی ================= */
.composer-trigger{
  display:flex;align-items:center;gap:10px;width:100%;
  background:#f4f7f6;
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 12px;
  font-size:14.5px;
  color:var(--muted);
  cursor:pointer;
  text-align:right;
  transition:background .15s,border-color .15s;
}
.composer-trigger:active{background:#eaf0ee}
.plus-circle{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:linear-gradient(140deg,var(--primary),var(--primary-2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;
  box-shadow:0 3px 8px rgba(14,122,95,.35);
}

/* ================= فورم ================= */
.post-form{margin-top:4px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:#3c4b46;margin-bottom:6px}
input[type=text],input[type=tel],select,textarea{
  width:100%;padding:11px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:15px;background:#fbfcfc;color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
textarea{resize:vertical;min-height:70px;line-height:1.7}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 3px rgba(14,122,95,.13);
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7d8b86 50%),linear-gradient(135deg,#7d8b86 50%,transparent 50%);background-position:calc(0% + 16px) calc(50% + 2px),calc(0% + 21px) calc(50% + 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.row2{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{
  display:inline-block;padding:8px 15px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:13px;
  transition:all .15s;white-space:nowrap;
}
.chip input:checked + span{
  background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 3px 10px rgba(14,122,95,.3);
}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.7}

.form-actions{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;border:0;border-radius:13px;padding:13px 16px;
  font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s;
}
.btn:active{transform:scale(.98)}
.btn.primary{
  background:linear-gradient(140deg,var(--primary),var(--primary-2));
  color:#fff;box-shadow:0 5px 16px rgba(14,122,95,.32);
}
.btn.ghost{background:#eef2f0;color:#4a5a55;flex:0 0 auto;padding:13px 20px}

/* ================= فید ================= */
.feed-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.feed-head h2{margin:0;font-size:16px;font-weight:700}
.count{font-size:12px;color:var(--muted);background:#fff;padding:3px 10px;border-radius:999px;box-shadow:var(--shadow)}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4a5a55;
  padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.fchip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(14,122,95,.28)}

.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:580px){.posts{grid-template-columns:repeat(3,1fr)}}
.post{
  background:#fff;border:1px solid #eef2f0;border-radius:15px;
  box-shadow:var(--shadow);padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;
  transition:transform .12s,box-shadow .12s;
  animation:fade .25s ease;
}
.post:active{transform:scale(.975)}
.post-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cat-emoji{
  width:36px;height:36px;border-radius:11px;background:#f1f6f4;
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.badge{
  font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:600;
  background:#e8f4ef;color:#0e7a5f;white-space:nowrap;
}
.badge.used{background:#fdf1dd;color:#a9761a}
.post-title{
  margin:2px 0 0;font-size:14px;font-weight:600;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:44px;
}
.post-price{font-size:14px;font-weight:700;color:var(--primary-2)}
.post-meta{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:1px;margin-top:auto}
.post-meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{
  grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
}
.empty .big{font-size:38px;display:block;margin-bottom:8px}
.empty p{margin:4px 0;font-size:14px}

/* ================= مودال جزئیات ================= */
.modal{
  position:fixed;inset:0;z-index:100;
  background:rgba(8,30,24,.55);
  backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;
}
.modal.open{display:flex}
.sheet{
  background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:20px 18px 26px;
  animation:up .28s cubic-bezier(.2,.8,.3,1);
  position:relative;
}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:600px){
  .modal{align-items:center}
  .sheet{border-radius:22px}
}
.sheet-close{
  position:absolute;top:12px;left:12px;
  border:0;background:#eef2f0;color:#5c6b66;
  width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;
}
.sheet .cat-emoji{width:52px;height:52px;font-size:26px;border-radius:15px}
.detail-title{font-size:19px;font-weight:700;margin:12px 0 6px;line-height:1.6}
.detail-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detail-price{
  font-size:20px;font-weight:700;color:var(--primary-2);
  background:#f1f8f5;border-radius:13px;padding:11px 14px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
}
.detail-price small{font-size:11.5px;font-weight:500;color:var(--muted)}
.detail-desc{
  background:#fafcfb;border:1px solid var(--line);border-radius:13px;
  padding:12px;font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word;
  margin-bottom:14px;
}
.info-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.info-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#3c4b46}
.info-row .ico{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#f1f6f4;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact-actions .btn{padding:13px 10px;font-size:14px}
.btn.call{background:linear-gradient(140deg,#0e7a5f,#0a5b46);color:#fff;box-shadow:0 5px 16px rgba(14,122,95,.3)}
.btn.wa{background:linear-gradient(140deg,#25d366,#128c7e);color:#fff;box-shadow:0 5px 16px rgba(18,140,126,.3);text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.copy{background:#eef2f0;color:#3c4b46;grid-column:1/-1}
.expire-note{
  margin-top:14px;font-size:12px;color:#a9761a;background:#fdf7ea;
  border:1px dashed #f0d79a;border-radius:12px;padding:9px 12px;text-align:center;
}

/* ================= توست ================= */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,26px);
  background:#12211c;color:#fff;padding:11px 20px;border-radius:999px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:all .28s;
  z-index:300;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= فوتر ================= */
.footer{
  text-align:center;font-size:11.5px;color:#8a9793;
  padding:22px 18px 10px;line-height:2;
}
</style>
</head>
<body>

<!-- ============ هدر با جستجو ============ -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <h1>بازار آنلاین کابل</h1>
        <p>هر چی می‌خواهی بفروش، بخر و جستجو کن — از اجناس نو تا دست دوم</p>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="جستجو در تمام آگهی‌ها… (مثلاً: موبایل، فرش، موتر)" autocomplete="off">
      <button class="clear-btn" id="clearSearch" hidden aria-label="پاک کردن">✕</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- ============ باکس نوشتن آگهی ============ -->
  <section class="card">
    <button class="composer-trigger" id="composerTrigger">
      <span class="plus-circle">＋</span>
      <span>چه چیزی برای فروش دارید؟</span>
    </button>

    <form class="post-form" id="postForm" hidden>
      <div class="field">
        <label for="fTitle">عنوان آگهی *</label>
        <input id="fTitle" type="text" maxlength="70" placeholder="مثلاً: موبایل سامسونگ A12، حالت خوب">
      </div>

      <div class="row2">
        <div class="field">
          <label for="fCategory">کتگوری</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label for="fCondition">حالت کالا</label>
          <select id="fCondition">
            <option value="نو">نو</option>
            <option value="دست دوم">دست دوم</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="fPrice">قیمت (افغانی)</label>
          <input id="fPrice" type="text" inputmode="numeric" maxlength="12" placeholder="مثلاً ۵۰۰۰ — خالی = توافقی">
        </div>
        <div class="field">
          <label for="fCity">شهر / ولایت</label>
          <input id="fCity" type="text" maxlength="30" value="کابل">
        </div>
      </div>

      <div class="field">
        <label for="fDesc">توضیحات</label>
        <textarea id="fDesc" rows="3" maxlength="600" placeholder="جزئیات کالا، حالت آن، جای تحویل و هر چیزی که خریدار باید بداند…"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label for="fName">نام شما *</label>
          <input id="fName" type="text" maxlength="30" placeholder="نام و تخلص">
        </div>
        <div class="field">
          <label for="fPhone">شماره تماس *</label>
          <input id="fPhone" type="tel" inputmode="tel" maxlength="18" placeholder="۰۷۰۰ ۰۰۰ ۰۰۰">
        </div>
      </div>

      <div class="field">
        <label>مدت نمایش آگهی</label>
        <div class="chips" id="durationChips"></div>
        <p class="hint">⏳ آگهی شما بعد از این مدت به صورت خودکار از سایت حذف می‌شود.</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary">نشر آگهی</button>
        <button type="button" class="btn ghost" id="cancelPost">لغو</button>
      </div>
    </form>
  </section>

  <!-- ============ فید آگهی‌ها ============ -->
  <div class="feed-head">
    <h2>آگهی‌های تازه</h2>
    <span class="count" id="postCount">۰ آگهی</span>
  </div>

  <nav class="filter-chips" id="filterChips"></nav>

  <div class="posts" id="postsList"></div>

  <div class="footer">
    بازار آنلاین کابل — بخر، بفروش، جستجو کن 🛒<br>
    هر آگهی بعد از مدت انتخاب‌شده به صورت خودکار حذف می‌شود.
  </div>
</div>

<!-- ============ مودال جزئیات ============ -->
<div class="modal" id="detailModal">
  <div class="sheet" id="detailSheet">
    <button class="sheet-close" id="closeDetail" aria-label="بستن">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   بازار آنلاین کابل — منطق برنامه
   ========================================================= */

const STORAGE_KEY = 'kabul_bazaar_posts_v1';

const CATEGORIES = [
  { id:'mobile',   label:'موبایل و تابلت',        emoji:'📱' },
  { id:'computer', label:'کمپیوتر و لپ‌تاپ',      emoji:'💻' },
  { id:'home',     label:'خانه و آشپزخانه',        emoji:'🏠' },
  { id:'clothes',  label:'لباس و پوشاک',           emoji:'👕' },
  { id:'vehicle',  label:'موتر و وسایل نقلیه',     emoji:'🚗' },
  { id:'books',    label:'کتاب و قرطاسیه',         emoji:'📚' },
  { id:'toys',     label:'اسباب‌بازی و طفلانه',    emoji:'🧸' },
  { id:'service',  label:'خدمات',                  emoji:'🛠️' },
  { id:'other',    label:'سایر',                   emoji:'📦' }
];

const DURATIONS = [
  { h: 24,  label: '۱ روز'  },
  { h: 72,  label: '۳ روز'  },
  { h: 168, label: '۷ روز'  },
  { h: 336, label: '۱۴ روز' },
  { h: 720, label: '۳۰ روز' }
];

let posts = [];
let searchQuery = '';
let activeCat = 'all';

/* ---------- عناصر ---------- */
const $ = s => document.querySelector(s);
const postsList     = $('#postsList');
const postCount     = $('#postCount');
const filterChips   = $('#filterChips');
const durationChips = $('#durationChips');
const searchInput   = $('#searchInput');
const clearSearch   = $('#clearSearch');
const composerTrigger = $('#composerTrigger');
const postForm      = $('#postForm');
const cancelPost    = $('#cancelPost');
const detailModal   = $('#detailModal');
const detailBody    = $('#detailBody');
const closeDetail   = $('#closeDetail');
const toastEl       = $('#toast');

/* ---------- کمک‌کننده‌ها ---------- */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

function faNum(v){
  return String(v).replace(/\d/g, d => FA_DIGITS[+d]);
}
function toEnDigits(str){
  return String(str)
    .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function esc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function catById(id){
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ---------- زمان ---------- */
function remainingText(expiresAt){
  const ms = expiresAt - Date.now();
  if (ms <= 0) return 'منقضی شده';
  const mins  = Math.floor(ms / 60000);
  const hours = Math.floor(mins / 60);
  const days  = Math.floor(hours / 24);
  if (days  >= 1) return faNum(days)  + ' روز باقی مانده';
  if (hours >= 1) return faNum(hours) + ' ساعت باقی مانده';
  if (mins  >= 1) return faNum(mins)  + ' دقیقه باقی مانده';
  return 'کمتر از یک دقیقه باقی مانده';
}
function postedDate(ts){
  try {
    return new Date(ts).toLocaleDateString('fa-AF', {
      year:'numeric', month:'long', day:'numeric'
    });
  } catch (e) {
    return faNum(new Date(ts).toLocaleDateString());
  }
}

/* ---------- ذخیره‌سازی ---------- */
function loadPosts(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    posts = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(posts)) posts = [];
  } catch (e) {
    posts = [];
  }
}
function savePosts(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  } catch (e) {
    toast('حافظه پُر است، بعضی آگهی‌ها ذخیره نشد');
  }
}
function pruneExpired(){
  const now = Date.now();
  const before = posts.length;
  posts = posts.filter(p => p && p.expiresAt > now);
  if (posts.length !== before) savePosts();
}

/* ---------- ساخت چیپ‌ها ---------- */
function buildDurationChips(){
  durationChips.innerHTML = DURATIONS.map(d => `
    <label class="chip">
      <input type="radio" name="duration" value="${d.h}" ${d.h === 168 ? 'checked' : ''}>
      <span>${d.label}</span>
    </label>
  `).join('');
}

function buildCategorySelect(){
  $('#fCategory').innerHTML = CATEGORIES.map(c =>
    `<option value="${c.id}">${c.emoji} ${c.label}</option>`
  ).join('');
}

function buildFilterChips(){
  filterChips.innerHTML =
    `<button class="fchip active" data-cat="all">همه</button>` +
    CATEGORIES.map(c =>
      `<button class="fchip" data-cat="${c.id}">${c.emoji} ${c.label}</button>`
    ).join('');
}

/* ---------- رندر فید ---------- */
function renderPosts(){
  pruneExpired();

  const q = searchQuery.trim().toLowerCase();
  let list = posts.slice();

  if (activeCat !== 'all') list = list.filter(p => p.category === activeCat);

  if (q) {
    list = list.filter(p => {
      const c = catById(p.category);
      const hay = [p.title, p.desc, p.city, p.name, c.label, p.condition]
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  list.sort((a, b) => b.createdAt - a.createdAt);

  postCount.textContent = faNum(list.length) + ' آگهی';

  if (!list.length) {
    const msg = (q || activeCat !== 'all')
      ? 'هیچ آگهی‌ای مطابق جستجوی شما پیدا نشد.'
      : 'هنوز هیچ آگهی‌ای ثبت نشده است. اولین نفر باشید!';
    postsList.innerHTML = `
      <div class="empty">
        <span class="big">🔎</span>
        <p>${msg}</p>
        <p style="font-size:12.5px">می‌توانید خودتان یک آگهی نشر کنید.</p>
      </div>`;
    return;
  }

  postsList.innerHTML = list.map(p => {
    const c = catById(p.category);
    return `
      <article class="post" data-id="${p.id}">
        <div class="post-top">
          <div class="cat-emoji">${c.emoji}</div>
          <span class="badge ${p.condition === 'دست دوم' ? 'used' : ''}">${esc(p.condition)}</span>
        </div>
        <h3 class="post-title">${esc(p.title)}</h3>
        <div class="post-price">${priceHtml(p.price)}</div>
        <div class="post-meta">
          <span>📍 ${esc(p.city || 'کابل')}</span>
          <span>⏳ ${remainingText(p.expiresAt)}</span>
        </div>
      </article>`;
  }).join('');
}

function priceHtml(price){
  const digits = toEnDigits(price || '').replace(/[^\d]/g, '');
  if (!digits) return 'توافقی';
  return faNum(Number(digits).toLocaleString('en-US')) + ' افغانی';
}

/* ---------- نشر آگهی ---------- */
postForm.addEventListener('submit', e => {
  e.preventDefault();

  const title     = $('#fTitle').value.trim();
  const category  = $('#fCategory').value;
  const condition = $('#fCondition').value;
  const price     = $('#fPrice').value.trim();
  const city      = $('#fCity').value.trim() || 'کابل';
  const desc      = $('#fDesc').value.trim();
  const name      = $('#fName').value.trim();
  const phoneRaw  = $('#fPhone').value.trim();

  if (!title)  { toast('لطفاً عنوان آگهی را بنویسید'); $('#fTitle').focus(); return; }
  if (!name)   { toast('لطفاً نام خود را بنویسید');    $('#fName').focus();  return; }
  if (!phoneRaw){ toast('لطفاً شماره تماس را بنویسید'); $('#fPhone').focus(); return; }

  const phone = toEnDigits(phoneRaw).replace(/[\s\-()]/g, '');
  if (!/^\+?\d{9,15}$/.test(phone)) {
    toast('شماره تماس درست نیست (مثلاً ۰۷۰۰۰۰۰۰۰۰)');
    $('#fPhone').focus();
    return;
  }

  const checked = postForm.querySelector('input[name="duration"]:checked');
  const hours = checked ? Number(checked.value) : 168;
  const now = Date.now();

  posts.unshift({
    id: 'p' + now + Math.random().toString(36).slice(2, 7),
    title, category, condition, price, city, desc, name, phone,
    createdAt: now,
    expiresAt: now + hours * 3600000,
    hours
  });

  savePosts();

  /* ریست فورم */
  postForm.reset();
  $('#fCity').value = 'کابل';
  const def = postForm.querySelector('input[name="duration"][value="168"]');
  if (def) def.checked = true;
  postForm.hidden = true;

  searchQuery = '';
  searchInput.value = '';
  clearSearch.hidden = true;
  activeCat = 'all';
  buildFilterChips();

  renderPosts();
  toast('آگهی شما با موفقیت نشر شد ✅');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- باز/بسته کردن فورم ---------- */
composerTrigger.addEventListener('click', () => {
  postForm.hidden = false;
  composerTrigger.parentElement.querySelector('.composer-trigger').style.display = 'none';
  setTimeout(() => $('#fTitle').focus(), 120);
});
cancelPost.addEventListener('click', () => {
  postForm.hidden = true;
  document.querySelector('.composer-trigger').style.display = 'flex';
});

/* ---------- جستجو ---------- */
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  clearSearch.hidden = !searchQuery;
  renderPosts();
});
clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearSearch.hidden = true;
  renderPosts();
  searchInput.focus();
});

/* ---------- فلتر کتگوری ---------- */
filterChips.addEventListener('click', e => {
  const btn = e.target.closest('.fchip');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  filterChips.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
});

/* ---------- کلیک روی کارت ---------- */
postsList.addEventListener('click', e => {
  const card = e.target.closest('.post');
  if (!card) return;
  openDetail(card.dataset.id);
});

/* ---------- جزئیات آگهی ---------- */
function openDetail(id){
  const p = posts.find(x => x.id === id);
  if (!p) return;
  const c = catById(p.category);

  let wa = p.phone.replace(/\D/g, '');
  if (wa.startsWith('0')) wa = '93' + wa.slice(1);
  else if (!wa.startsWith('93')) wa = '93' + wa;

  detailBody.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      <div class="cat-emoji">${c.emoji}</div>
      <div>
        <div style="font-size:12.5px;color:var(--muted)">${c.label}</div>
        <div style="font-size:12px;color:var(--muted)">📅 ${postedDate(p.createdAt)}</div>
      </div>
    </div>

    <h2 class="detail-title">${esc(p.title)}</h2>

    <div class="detail-badges">
      <span class="badge ${p.condition === 'دست دوم' ? 'used' : ''}">${esc(p.condition)}</span>
      <span class="badge">📍 ${esc(p.city)}</span>
    </div>

    <div class="detail-price">
      <span>${priceHtml(p.price)}</span>
      <small>قیمت</small>
    </div>

    ${p.desc ? `<div class="detail-desc">${esc(p.desc)}</div>` : ''}

    <div class="info-list">
      <div class="info-row"><span class="ico">👤</span><span>${esc(p.name)}</span></div>
      <div class="info-row"><span class="ico">📞</span><span dir="ltr">${esc(p.phone)}</span></div>
      <div class="info-row"><span class="ico">📍</span><span>${esc(p.city)}</span></div>
    </div>

    <div class="contact-actions">
      <a class="btn call" href="tel:${esc(p.phone)}">📞 تماس گرفتن</a>
      <a class="btn wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 واتس‌اپ</a>
      <button class="btn copy" data-copy="${esc(p.phone)}">📋 کاپی کردن شماره تماس</button>
    </div>

    <div class="expire-note">
      ⏳ این آگهی ${remainingText(p.expiresAt)} و بعد از آن به صورت خودکار حذف می‌شود.
    </div>
  `;

  detailModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetailModal(){
  detailModal.classList.remove('open');
  document.body.style.overflow = '';
}
closeDetail.addEventListener('click', closeDetailModal);
detailModal.addEventListener('click', e => {
  if (e.target === detailModal) closeDetailModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detailModal.classList.contains('open')) closeDetailModal();
});

/* ---------- کاپی شماره ---------- */
detailBody.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  copyText(btn.dataset.copy);
});
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => toast('شماره کاپی شد ✅'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast('شماره کاپی شد ✅');
  } catch (e) {
    toast('کاپی نشد، لطفاً دستی بنویسید');
  }
  document.body.removeChild(ta);
}

/* ---------- شروع ---------- */
function init(){
  buildDurationChips();
  buildCategorySelect();
  buildFilterChips();
  loadPosts();
  pruneExpired();
  renderPosts();

  /* هر ۳۰ ثانیه: حذف آگهی‌های منقضی و بروزرسانی زمان‌ها */
  setInterval(() => {
    pruneExpired();
    renderPosts();
  }, 30000);
}
init();
</script>
</body>
</html>
